name: Artificial pathway F
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      REPLICATION_CANARY: synthetic-value-no-credential
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/runner
